<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Cybersecurity Fundamentals: a shield with a padlock over a network of connected nodes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- network lines -->
  <g stroke="#34d399" stroke-width="2" opacity="0.35">
    <line x1="80" y1="80" x2="220" y2="150"/>
    <line x1="80" y1="80" x2="110" y2="250"/>
    <line x1="110" y1="250" x2="230" y2="300"/>
    <line x1="520" y1="70" x2="390" y2="150"/>
    <line x1="520" y1="70" x2="500" y2="230"/>
    <line x1="500" y1="230" x2="380" y2="310"/>
    <line x1="300" y1="30" x2="220" y2="150"/>
    <line x1="300" y1="30" x2="390" y2="150"/>
  </g>
  <g fill="#34d399">
    <circle cx="80" cy="80" r="9"/>
    <circle cx="110" cy="250" r="9"/>
    <circle cx="520" cy="70" r="9"/>
    <circle cx="500" cy="230" r="9"/>
    <circle cx="300" cy="30" r="7"/>
    <circle cx="230" cy="300" r="6"/>
    <circle cx="380" cy="310" r="6"/>
  </g>
  <!-- shield -->
  <path d="M300 60 L420 105 V200 Q420 290 300 345 Q180 290 180 200 V105 Z" fill="url(#shield)" stroke="#a7f3d0" stroke-width="5" stroke-linejoin="round"/>
  <path d="M300 82 L400 118 V200 Q400 275 300 322 Q200 275 200 200 V118 Z" fill="#064e3b" opacity="0.35"/>
  <!-- padlock -->
  <path d="M270 190 V170 a30 30 0 0 1 60 0 V190" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <rect x="254" y="188" width="92" height="76" rx="14" fill="#ffffff"/>
  <circle cx="300" cy="219" r="10" fill="#059669"/>
  <rect x="295" y="224" width="10" height="20" rx="4" fill="#059669"/>
</svg>
