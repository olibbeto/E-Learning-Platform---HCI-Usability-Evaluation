<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Database Systems: stacked database cylinders connected to a table grid with a magnifier badge">
  <defs>
    <linearGradient id="bg-db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cyl-db" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-db)"/>
  <circle cx="530" cy="50" r="100" fill="#ffffff" opacity="0.08"/>
  <circle cx="55" cy="365" r="110" fill="#ffffff" opacity="0.08"/>
  <!-- database cylinders (3 stacked) -->
  <!-- cylinder 3 (bottom) -->
  <rect x="88" y="222" width="160" height="68" rx="6" fill="#0f766e"/>
  <ellipse cx="168" cy="222" rx="80" ry="18" fill="#2dd4bf"/>
  <ellipse cx="168" cy="290" rx="80" ry="18" fill="#0d9488"/>
  <ellipse cx="168" cy="222" rx="80" ry="18" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.5"/>
  <!-- cylinder 2 (middle) -->
  <rect x="88" y="148" width="160" height="68" rx="6" fill="#0e7490"/>
  <ellipse cx="168" cy="148" rx="80" ry="18" fill="#38bdf8"/>
  <ellipse cx="168" cy="216" rx="80" ry="18" fill="#0369a1"/>
  <ellipse cx="168" cy="148" rx="80" ry="18" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.5"/>
  <!-- cylinder 1 (top) -->
  <rect x="88" y="80" width="160" height="62" rx="6" fill="#0f766e"/>
  <ellipse cx="168" cy="80" rx="80" ry="18" fill="url(#cyl-db)"/>
  <ellipse cx="168" cy="142" rx="80" ry="18" fill="#0d9488"/>
  <ellipse cx="168" cy="80" rx="80" ry="18" fill="none" stroke="#a7f3d0" stroke-width="2" opacity="0.6"/>
  <!-- connector lines to table -->
  <line x1="248" y1="190" x2="310" y2="190" stroke="#5eead4" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.7"/>
  <line x1="248" y1="225" x2="310" y2="225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 4" opacity="0.5"/>
  <!-- data table -->
  <rect x="310" y="75" width="250" height="240" rx="12" fill="#ffffff" opacity="0.92"/>
  <!-- table header row -->
  <rect x="310" y="75" width="250" height="36" rx="12" fill="#0d9488"/>
  <rect x="310" y="95" width="250" height="16" fill="#0d9488"/>
  <!-- header column dividers -->
  <line x1="394" y1="75" x2="394" y2="111" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="474" y1="75" x2="474" y2="111" stroke="#0f766e" stroke-width="1.5"/>
  <!-- header cells (colored bars) -->
  <rect x="322" y="85" width="62" height="10" rx="4" fill="#a7f3d0" opacity="0.8"/>
  <rect x="402" y="85" width="62" height="10" rx="4" fill="#99f6e4" opacity="0.8"/>
  <rect x="482" y="85" width="66" height="10" rx="4" fill="#a7f3d0" opacity="0.8"/>
  <!-- row dividers -->
  <line x1="310" y1="111" x2="560" y2="111" stroke="#d1fae5" stroke-width="1.5"/>
  <line x1="310" y1="145" x2="560" y2="145" stroke="#d1fae5" stroke-width="1.5"/>
  <line x1="310" y1="179" x2="560" y2="179" stroke="#d1fae5" stroke-width="1.5"/>
  <line x1="310" y1="213" x2="560" y2="213" stroke="#d1fae5" stroke-width="1.5"/>
  <line x1="310" y1="247" x2="560" y2="247" stroke="#d1fae5" stroke-width="1.5"/>
  <!-- col dividers body -->
  <line x1="394" y1="111" x2="394" y2="315" stroke="#d1fae5" stroke-width="1"/>
  <line x1="474" y1="111" x2="474" y2="315" stroke="#d1fae5" stroke-width="1"/>
  <!-- row data cells (colored bars) -->
  <rect x="322" y="121" width="54" height="8" rx="3" fill="#0d9488" opacity="0.25"/>
  <rect x="402" y="121" width="46" height="8" rx="3" fill="#0369a1" opacity="0.2"/>
  <rect x="482" y="121" width="58" height="8" rx="3" fill="#0d9488" opacity="0.2"/>
  <rect x="322" y="155" width="62" height="8" rx="3" fill="#0d9488" opacity="0.2"/>
  <rect x="402" y="155" width="38" height="8" rx="3" fill="#0369a1" opacity="0.25"/>
  <rect x="482" y="155" width="50" height="8" rx="3" fill="#0d9488" opacity="0.15"/>
  <rect x="322" y="189" width="46" height="8" rx="3" fill="#0d9488" opacity="0.25"/>
  <rect x="402" y="189" width="58" height="8" rx="3" fill="#0369a1" opacity="0.2"/>
  <rect x="482" y="189" width="62" height="8" rx="3" fill="#0d9488" opacity="0.2"/>
  <rect x="322" y="223" width="58" height="8" rx="3" fill="#0d9488" opacity="0.2"/>
  <rect x="402" y="223" width="50" height="8" rx="3" fill="#0369a1" opacity="0.15"/>
  <rect x="482" y="223" width="42" height="8" rx="3" fill="#0d9488" opacity="0.25"/>
  <rect x="322" y="257" width="40" height="8" rx="3" fill="#0d9488" opacity="0.25"/>
  <rect x="402" y="257" width="62" height="8" rx="3" fill="#0369a1" opacity="0.2"/>
  <rect x="482" y="257" width="54" height="8" rx="3" fill="#0d9488" opacity="0.2"/>
  <!-- magnifier badge -->
  <circle cx="148" cy="340" r="40" fill="#ffffff" opacity="0.95"/>
  <!-- magnifier glass -->
  <circle cx="142" cy="334" r="16" fill="none" stroke="#0d9488" stroke-width="7"/>
  <line x1="153" y1="345" x2="166" y2="358" stroke="#0d9488" stroke-width="7" stroke-linecap="round"/>
  <!-- lens highlight -->
  <circle cx="137" cy="328" r="5" fill="none" stroke="#5eead4" stroke-width="2.5" opacity="0.6"/>
</svg>
