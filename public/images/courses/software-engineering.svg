<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Software Engineering: a circular sprint cycle diagram next to a kanban board with a gear badge">
  <defs>
    <linearGradient id="bg-se" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-se)"/>
  <circle cx="55" cy="55" r="95" fill="#ffffff" opacity="0.08"/>
  <circle cx="555" cy="355" r="105" fill="#ffffff" opacity="0.08"/>
  <!-- sprint cycle ring -->
  <!-- outer ring track -->
  <circle cx="185" cy="200" r="118" fill="none" stroke="#ffffff" stroke-width="16" opacity="0.15"/>
  <!-- arc segments -->
  <path d="M185 82 A118 118 0 0 1 296 257" fill="none" stroke="#fbbf24" stroke-width="16" stroke-linecap="round"/>
  <path d="M296 257 A118 118 0 0 1 100 293" fill="none" stroke="#fb923c" stroke-width="16" stroke-linecap="round"/>
  <path d="M100 293 A118 118 0 0 1 185 82" fill="none" stroke="#fde68a" stroke-width="16" stroke-linecap="round"/>
  <!-- arrow heads on the ring -->
  <polygon points="296,252 308,264 284,270" fill="#fb923c"/>
  <polygon points="97,290 82,280 96,268" fill="#fde68a"/>
  <polygon points="182,80 194,66 200,84" fill="#fbbf24"/>
  <!-- inner circle -->
  <circle cx="185" cy="200" r="76" fill="#ffffff" opacity="0.15"/>
  <circle cx="185" cy="200" r="52" fill="#ffffff" opacity="0.2"/>
  <!-- sprint label dots -->
  <circle cx="185" cy="148" r="8" fill="#fbbf24"/>
  <circle cx="244" cy="236" r="8" fill="#fb923c"/>
  <circle cx="126" cy="236" r="8" fill="#fde68a"/>
  <!-- kanban board -->
  <rect x="320" y="60" width="248" height="280" rx="14" fill="#ffffff" opacity="0.92"/>
  <!-- kanban header -->
  <rect x="320" y="60" width="248" height="30" rx="14" fill="#fde68a"/>
  <rect x="320" y="76" width="248" height="14" fill="#fde68a"/>
  <!-- three columns -->
  <!-- col 1: To Do -->
  <rect x="332" y="100" width="68" height="14" rx="4" fill="#fb923c" opacity="0.7"/>
  <rect x="332" y="122" width="68" height="36" rx="6" fill="#fef3c7"/>
  <rect x="332" y="164" width="68" height="36" rx="6" fill="#fef3c7"/>
  <rect x="332" y="206" width="68" height="36" rx="6" fill="#fef3c7"/>
  <!-- col 2: In Progress -->
  <rect x="412" y="100" width="68" height="14" rx="4" fill="#f59e0b" opacity="0.7"/>
  <rect x="412" y="122" width="68" height="36" rx="6" fill="#fef9c3"/>
  <rect x="412" y="164" width="68" height="36" rx="6" fill="#fef9c3"/>
  <!-- col 3: Done -->
  <rect x="492" y="100" width="66" height="14" rx="4" fill="#4ade80" opacity="0.7"/>
  <rect x="492" y="122" width="66" height="36" rx="6" fill="#f0fdf4"/>
  <!-- check marks on done cards -->
  <path d="M504 138 l5 5 l10 -10" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- card content lines -->
  <rect x="340" y="130" width="50" height="5" rx="2" fill="#f59e0b" opacity="0.4"/>
  <rect x="340" y="139" width="36" height="5" rx="2" fill="#f59e0b" opacity="0.25"/>
  <rect x="340" y="172" width="50" height="5" rx="2" fill="#f59e0b" opacity="0.4"/>
  <rect x="340" y="181" width="42" height="5" rx="2" fill="#f59e0b" opacity="0.25"/>
  <rect x="420" y="130" width="50" height="5" rx="2" fill="#f59e0b" opacity="0.4"/>
  <rect x="420" y="139" width="30" height="5" rx="2" fill="#f59e0b" opacity="0.25"/>
  <!-- gear badge -->
  <circle cx="136" cy="340" r="40" fill="#ffffff" opacity="0.95"/>
  <!-- gear outer -->
  <circle cx="136" cy="340" r="22" fill="none" stroke="#f59e0b" stroke-width="14"/>
  <!-- gear teeth (8 teeth using dashes) -->
  <circle cx="136" cy="340" r="22" fill="none" stroke="#f59e0b" stroke-width="14" stroke-dasharray="6 9.8" stroke-dashoffset="0"/>
  <!-- gear inner hole -->
  <circle cx="136" cy="340" r="10" fill="#ffffff" opacity="0.95"/>
  <circle cx="136" cy="340" r="5" fill="#f59e0b"/>
</svg>
