<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Human-Computer Interaction: a wireframe interface with a cursor and a user icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="520" cy="60" r="90" fill="#ffffff" opacity="0.08"/>
  <circle cx="60" cy="360" r="110" fill="#ffffff" opacity="0.08"/>
  <!-- window -->
  <rect x="120" y="70" width="360" height="240" rx="14" fill="#ffffff"/>
  <rect x="120" y="70" width="360" height="34" rx="14" fill="#e0e7ff"/>
  <rect x="120" y="90" width="360" height="14" fill="#e0e7ff"/>
  <circle cx="142" cy="87" r="5" fill="#f87171"/>
  <circle cx="160" cy="87" r="5" fill="#fbbf24"/>
  <circle cx="178" cy="87" r="5" fill="#34d399"/>
  <!-- wireframe content -->
  <rect x="142" y="122" width="90" height="70" rx="8" fill="#c7d2fe"/>
  <rect x="246" y="124" width="200" height="12" rx="6" fill="#a5b4fc"/>
  <rect x="246" y="146" width="160" height="10" rx="5" fill="#e0e7ff"/>
  <rect x="246" y="166" width="180" height="10" rx="5" fill="#e0e7ff"/>
  <rect x="142" y="212" width="120" height="38" rx="19" fill="#6366f1"/>
  <rect x="280" y="212" width="120" height="38" rx="19" fill="#e0e7ff"/>
  <!-- checklist -->
  <rect x="142" y="266" width="14" height="14" rx="3" fill="#34d399"/>
  <path d="M145 273 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="166" y="270" width="110" height="6" rx="3" fill="#c7d2fe"/>
  <!-- cursor -->
  <path d="M212 232 L212 282 L226 270 L236 292 L246 287 L236 266 L254 264 Z" fill="#111827" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <!-- user icon -->
  <circle cx="500" cy="300" r="42" fill="#ffffff" opacity="0.95"/>
  <circle cx="500" cy="290" r="14" fill="#6366f1"/>
  <path d="M472 326 Q500 296 528 326" fill="#6366f1"/>
</svg>
