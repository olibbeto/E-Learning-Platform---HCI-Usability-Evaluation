<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="UI/UX Design: a phone wireframe next to a layout grid with color swatches and a pencil badge">
  <defs>
    <linearGradient id="bg-ux" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-ux)"/>
  <circle cx="60" cy="60" r="100" fill="#ffffff" opacity="0.08"/>
  <circle cx="550" cy="360" r="110" fill="#ffffff" opacity="0.08"/>
  <!-- phone frame -->
  <rect x="90" y="60" width="140" height="260" rx="20" fill="#ffffff"/>
  <rect x="90" y="60" width="140" height="260" rx="20" fill="none" stroke="#fda4af" stroke-width="3"/>
  <!-- phone notch -->
  <rect x="140" y="68" width="40" height="10" rx="5" fill="#fda4af"/>
  <!-- phone screen content - wireframe -->
  <rect x="104" y="92" width="112" height="42" rx="6" fill="#fce7f3"/>
  <rect x="104" y="144" width="52" height="50" rx="6" fill="#fbcfe8"/>
  <rect x="162" y="144" width="54" height="22" rx="4" fill="#fce7f3"/>
  <rect x="162" y="172" width="54" height="22" rx="4" fill="#fce7f3"/>
  <rect x="104" y="204" width="112" height="14" rx="4" fill="#fbcfe8"/>
  <rect x="104" y="224" width="90" height="10" rx="3" fill="#fce7f3"/>
  <rect x="104" y="242" width="70" height="10" rx="3" fill="#fce7f3"/>
  <!-- phone home indicator -->
  <rect x="148" y="298" width="44" height="5" rx="3" fill="#fda4af"/>
  <!-- layout grid / desktop canvas -->
  <rect x="260" y="70" width="260" height="210" rx="12" fill="#ffffff" opacity="0.92"/>
  <!-- grid header -->
  <rect x="260" y="70" width="260" height="26" rx="12" fill="#fce7f3"/>
  <rect x="260" y="84" width="260" height="12" fill="#fce7f3"/>
  <circle cx="278" cy="83" r="5" fill="#f87171"/>
  <circle cx="296" cy="83" r="5" fill="#fbbf24"/>
  <circle cx="314" cy="83" r="5" fill="#4ade80"/>
  <!-- grid layout lines -->
  <line x1="400" y1="96" x2="400" y2="280" stroke="#fda4af" stroke-width="1.5" opacity="0.5"/>
  <line x1="260" y1="170" x2="520" y2="170" stroke="#fda4af" stroke-width="1.5" opacity="0.5"/>
  <!-- grid content blocks -->
  <rect x="272" y="100" width="120" height="62" rx="6" fill="#fce7f3"/>
  <rect x="408" y="100" width="100" height="28" rx="5" fill="#fbcfe8"/>
  <rect x="408" y="134" width="100" height="28" rx="5" fill="#fce7f3"/>
  <rect x="272" y="178" width="58" height="88" rx="6" fill="#fbcfe8"/>
  <rect x="338" y="178" width="54" height="40" rx="6" fill="#fce7f3"/>
  <rect x="408" y="178" width="100" height="40" rx="6" fill="#fce7f3"/>
  <rect x="338" y="226" width="170" height="40" rx="6" fill="#fbcfe8"/>
  <!-- color swatches row -->
  <rect x="260" y="294" width="260" height="42" rx="10" fill="#ffffff" opacity="0.92"/>
  <circle cx="288" cy="315" r="12" fill="#f87171"/>
  <circle cx="316" cy="315" r="12" fill="#fb923c"/>
  <circle cx="344" cy="315" r="12" fill="#fbbf24"/>
  <circle cx="372" cy="315" r="12" fill="#4ade80"/>
  <circle cx="400" cy="315" r="12" fill="#38bdf8"/>
  <circle cx="428" cy="315" r="12" fill="#a78bfa"/>
  <circle cx="456" cy="315" r="12" fill="#f472b6"/>
  <!-- bezier/pen tool -->
  <circle cx="498" cy="315" r="4" fill="#db2777"/>
  <circle cx="522" cy="315" r="4" fill="#db2777"/>
  <path d="M498 315 C505 302 515 328 522 315" stroke="#db2777" stroke-width="2.5" fill="none"/>
  <!-- pencil badge -->
  <circle cx="130" cy="338" r="38" fill="#ffffff" opacity="0.95"/>
  <!-- pencil body -->
  <rect x="112" y="320" width="14" height="38" rx="3" transform="rotate(-30 119 339)" fill="#fbbf24"/>
  <!-- pencil tip -->
  <polygon points="101,356 109,344 117,356" fill="#f87171" transform="rotate(-30 109 350)"/>
  <!-- pencil eraser -->
  <rect x="125" y="320" width="14" height="8" rx="2" transform="rotate(-30 132 324)" fill="#fb923c"/>
  <!-- pencil line highlight -->
  <rect x="120" y="322" width="4" height="32" rx="2" transform="rotate(-30 122 338)" fill="#fef08a" opacity="0.6"/>
</svg>
